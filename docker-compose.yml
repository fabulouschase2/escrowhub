version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mvp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    command: >
      --bind 0.0.0.0:7880
      --rtc-bind 0.0.0.0:7881
      --port 7980
      --ws-port 7981
      --key ${LIVEKIT_KEY:-devkey}
      --secret ${LIVEKIT_SECRET:-devsecret}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7980:7980"
      - "7981:7981"
    environment:
      - LIVEKIT_KEY=${LIVEKIT_KEY:-devkey}
      - LIVEKIT_SECRET=${LIVEKIT_SECRET:-devsecret}

volumes:
  postgres_data: