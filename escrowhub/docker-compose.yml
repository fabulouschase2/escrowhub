services:
  backend:
    build: ./backend
    container_name: escrowhub-backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      CLUSTER: ${CLUSTER:-devnet}
      RPC_URL: ${RPC_URL:-https://api.devnet.solana.com}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5000}
      DATABASE_PATH: /app/data/escrowhub.db
      ESCROW_KEYPAIR_PATH: /app/data/escrow-authority.json
      FEE_WALLET: ${FEE_WALLET:-}
    volumes:
      - backend-data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "command -v curl >/dev/null && curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    container_name: escrowhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5000:80"

volumes:
  backend-data:
