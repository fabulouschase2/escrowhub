<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0D14" />

    <title>EscrowHub | Escrow Payments on Solana</title>
    <meta name="description" content="EscrowHub holds Solana payments in escrow until work is delivered. Buyers deposit on-chain, sellers share their screen live, disputes get resolved, and funds are released or refunded." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Social share -->
    <meta property="og:site_name" content="EscrowHub" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data: Organization + WebSite + SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "#organization",
          "name": "EscrowHub",
          "url": "/",
          "logo": "/favicon.svg",
          "description": "Escrow payment platform for Solana transactions with live screen-share verification and dispute resolution."
        },
        {
          "@type": "WebSite",
          "@id": "#website",
          "url": "/",
          "name": "EscrowHub",
          "publisher": { "@id": "#organization" }
        },
        {
          "@type": "SoftwareApplication",
          "name": "EscrowHub",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "Web",
          "description": "Escrow payments on Solana: on-chain deposits, live screen-share verification, and dispute resolution.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-apple-black antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
