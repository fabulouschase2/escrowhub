[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"
actix-cors = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bcrypt = "0.12"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
jsonwebtoken = "9"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
bs58 = "0.5"
solana-sdk = "1.18"
solana-client = "1.18"
solana-transaction-status = "1.18"

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
